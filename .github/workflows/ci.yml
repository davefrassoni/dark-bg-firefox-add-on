name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # package.ps1 uses Windows path handling, so build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Build both browsers
        shell: pwsh
        run: ./package.ps1

      - name: Validate the Firefox build (web-ext lint)
        run: npx --yes web-ext@8 lint --source-dir build/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: dist/*.zip
